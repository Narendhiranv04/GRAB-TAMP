domain: kitchen
# Exposure parity with the methods this baseline is compared against.
# VLM-TAMP and OWL-TAMP execute INSPECT actions and therefore see inside
# the closed storage regions; under initial_observation_only this
# baseline never opened one (inspection_trace was empty), so it was asked
# to assert facts about contents it could not observe.  That is not the
# identical exposure BASELINE_FIDELITY.md requires for comparable columns.
#
# This is parity of *information*, not of mechanism: the other methods
# spend planning actions to inspect, while this baseline is a one-shot
# planner and receives the inspection observation directly.  Report it as
# an adaptation.
observation_mode: fixed_full_inspection
model_condition: vilain_tamp_qwen
max_cp_corrections: 3
timeouts:
  symbolic_seconds: 200
  # 600 to match VLM-TAMP's and OWL-TAMP's transport timeout
  # (`timeout_seconds: float = 600.0` in both of their planners).  At 300 this
  # baseline faced a 2x tighter deadline than the methods it is tabled against
  # while making the slowest calls in the grid -- ~107 s measured for a
  # four-contact-sheet request with thinking on, against a server saturated at
  # --max-num-seqs 8 with a queue behind it.  The OpenAI client is constructed
  # with max_retries=0, so one slow call killed the episode outright and wrote
  # no artifact.  Equalising the deadline removes a harness advantage; it does
  # not change what is asked of the model.
  model_seconds: 600
  refinement_seconds: 200
output_root: runs/vilain_tamp_qwen
external_tools:
  # Relative to the repository root, or override with
  # ${VILAIN_FAST_DOWNWARD}.  An absolute path under a developer's home
  # directory made this baseline unrunnable on any other machine.
  fast_downward: ../third_party/fast-downward-24.06.1/fast-downward.py
  fast_downward_version: "24.06"
  val: ../third_party/VAL/build/vilain-release/bin/Validate
  val_version: null
object_estimator_model: qwen35-9b
reasoning_model: qwen35-9b
model_endpoint: http://127.0.0.1:18000/v1
served_model_family: Qwen/Qwen3.5-9B
served_revision: unverified
symbolic_planner: Fast Downward
search_configuration: lama-first
independent_model_calls: true
execute_by_default: false
# All baseline experimentation runs on this host and branch, so the
# provenance guard is pointed at it rather than at the branch the
# baseline was originally developed on.
#
# This must be updated whenever the working branch changes, and the failure is
# silent until it is expensive: `verify_repository_provenance` rejects a branch
# mismatch only on episodes where planning SUCCEEDED, so a stale value here
# destroys exactly the episodes worth keeping and leaves the failures intact.
execution_branch: baseline_executions
require_clean_execution_provenance: true
